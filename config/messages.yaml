# Customize the feedback messages shown when answers are correct or incorrect.
# Available placeholders:
#   correct:   {name}
#   incorrect: {name}, {your_answer}, {answer}, {hint}
# The full worked solution is always appended below incorrect messages.

correct:
  - "Correct, {name}! Well done."
  - "That's right, {name}! Keep it up."
  - "Nailed it, {name}!"

incorrect:
  - "Not quite, {name}. You answered {your_answer}, but the correct answer is {answer}."
  - "Close, {name}! You had {your_answer} — the right answer is {answer}."
  - "Not this time, {name}. You answered {your_answer}; it should be {answer}."

# Email subject lines
subjects:
  daily_problem: "Your Daily Discrete Math Problems"
  grade_response: "Your Results — Daily Discrete Math"
